rong></div><div class="sidebar-stat"><span>演示用例</span><strong>470</strong></div><div class="sidebar-stat"><span>根因候选</span><strong>3</strong></div><div class="sidebar-stat"><span>待验证 Bug</span><strong>1</strong></div><div class="small">重复示例，仅用于界面评审<br>来源未绑定 · 飞书未同步</div></section><div class="asidebottom"><span class="dot"></span>原型模式 · 未连接服务<br><span id="project-agent">GagaSort / 本机执行 Agent</span></div></aside><main><header><div class="headerleft"><button class="drawer-toggle" aria-label="切换导航抽屉" aria-expanded="true" onclick="toggleDrawer()">☰</button><div class="crumb" id="project-crumb">工作空间　/　GagaSort　/　测试任务</div></div><div class="topright"><span class="pill">界面原型</span><span class="avatar">YF</span></div></header><div class="banner">示例任务与数据仅用于界面评审。所有操作只改变当前页面，不执行测试、不修改账号、不向飞书写入。</div><div id="app"></div></main><div class="switcher"><label>布局比较</label><button onclick="cycle(-1)">←</button><button id="va" onclick="variant('A')">A 流程工作台</button><button id="vb" onclick="variant('B')">B 六列看板</button><button id="vc" onclick="variant('C')">C 决策优先</button><button onclick="cycle(1)">→</button></div><div id="overlay"></div><script>

function createProject(){const name=document.getElementById('new-project-name').value.trim();if(!name){toast('请填写项目名称');return}if([...projects.values()].some(p=>p.name===name)){toast('项目名称已存在');return}const id='project-'+projects.size;projects.set(id,{name,cases:[],stage:0,decisions:[],casePage:1,pageSize:10});closeModal();switchProject(id);toast('已创建空白原型项目，未连接真实仓库')}
function syncProject(){const project=projects.get(currentProject),name=project.name;document.getElementById('project-current').textContent=name;document.getElementById('project-crumb').textContent='工作空间 / '+name+' / 测试任务';document.getElementById('project-agent').textContent=name+' / '+(currentProject==='gagasort'?'本机执行 Agent（未连接）':'执行 Agent 未配置');const values=currentProject==='gagasort'?[8,cases.length,3,1]:[0,cases.length,0,0];document.querySelectorAll('.sidebar-stat strong').forEach((node,i)=>node.textContent=values[i]);}
function variant(v){layout=v;let u=new URL(location);u.searchParams.set('variant',v);history.replaceState(null,'',u);render()}function cycle(d){let a=['A','B','C'];variant(a[(a.indexOf(layout)+d+3)%3])}document.addEventListener('keydown',e=>{if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.target.isContentEditable)return;if(e.key==='ArrowLeft')cycle(-1);if(e.key==='ArrowRight')cycle(1)});
function toast(t){let d=document.createElement('div');d.className='toast';d.textContent=t;document.body.append(d);setTimeout(()=>d.remove(),3200)}function advance(){decisions.push('已确认「'+names[stage]+'」示例产物');stage=Math.min(5,stage+1);render();toast('模拟确认完成；未触发外部操作')}let modalScrollY=null,modalBodyWidth='';function lockModalScroll(){if(modalScrollY!==null)return;modalScrollY=window.scrollY;modalBodyWidth=document.body.style.width;const lockedWidth=document.body.getBoundingClientRect().width;document.body.style.position='fixed';document.body.style.top='-'+modalScrollY+'px';document.body.style.width=lockedWidth+'px';document.body.style.overflow='hidden'}function unlockModalScroll(){if(modalScrollY===null)return;const y=modalScrollY;modalScrollY=null;document.body.style.position='';document.body.style.top='';document.body.style.width=modalBodyWidth;document.body.style.overflow='';window.scrollTo(0,y)}function modal(title,content){lockModalScroll();document.getElementById('overlay').innerHTML='<div class="modalwrap" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="panelhead"><h2>'+title+'</h2><button onclick="closeModal()">关闭 ×</button></div><div class="panelbody">'+content+'</div></div></div>'}function closeModal(){document.getElementById('overlay').innerHTML='';unlockModalScroll()}function showSettings(){modal('连接器设置','<p class="muted">当前均未连接。此页仅展示未来需要配置的信息。</p><div class="field"><label>Unity 项目（已发现的本地路径）</label><input readonly value="'+(currentProject==='gagasort'?'/Users/yf/Documents/Unity/gagasort/GagaSort':'尚未配置')+'"></div><div class="field"><label>飞书 Bug 表链接</label><input placeholder="粘贴飞书链接"></div><div class="field"><label>GM 测试服务器 / 专用账号</label><input placeholder="待配置"></div><p class="small">代码拉取、Git 提交：禁止。自动关闭 Unity：关闭。</p><button class="primary" onclick="toast(\'原型不保存凭据，也不连接服务\')">检查连接（示意）</button>')}

function setPageSize(value){pageSize=Number(value);casePage=1;render()}function turnPage(delta){casePage=Math.max(1,Math.min(Math.ceil(cases.length/pageSize),casePage+delta));render()}
function caseTable(){let total=cases.length,pages=Math.max(1,Math.ceil(total/pageSize));casePage=Math.min(casePage,pages);let start=(casePage-1)*pageSize,rows=cases.slice(start,start+pageSize);return '<table><thead><tr><th><input type="checkbox" aria-label="选择本页全部用例" onclick="document.querySelectorAll(\'.casecheck\').forEach(x=>x.checked=this.checked)"></th><th>用例 / 测试点</th><th>验证方式</th><th>状态</th><th></th></tr></thead><tbody>'+rows.map((c,index)=>'<tr><td><input class="casecheck" type="checkbox" checked aria-label="选择'+c[0]+'"></td><td><div class="code">'+c[0]+'</div><div class="case-title">'+c[1]+'</div><div class="muted">'+c[2]+'</div></td><td>'+c[3]+'</td><td><span class="pill '+(c[4]==='未接入'?'warn':'')+'">'+c[4]+'</span></td><td><button onclick="caseDetail('+(start+index)+')">详情</button></td></tr>').join('')+'</tbody></table><div class="pagination"><span>共 '+total+' 条 · 当前展示 '+(total?start+1:0)+'–'+Math.min(start+pageSize,total)+' 条</span><div class="pagination-controls"><label for="page-size">每页</label><select id="page-size" onchange="setPageSize(this.value)">'+[10,20,50,100].map(n=>'<option value="'+n+'" '+(n===pageSize?'selected':'')+'>'+n+' 条</option>').join('')+'</select><button aria-label="上一页" '+(casePage===1?'disabled':'')+' onclick="turnPage(-1)">‹</button><span>'+casePage+' / '+pages+'</span><button aria-label="下一页" '+(casePage===pages?'disabled':'')+' onclick="turnPage(1)">›</button></div></div>'}
function caseDetail(i){let c=cases[i];modal(c[0]+' · '+c[1],'<span class="pill">示例用例</span><p><b>来源：</b>示例需求 / '+c[2]+'</p><p><b>前置条件：</b>专用测试账号，目标版本及配置已锁定。</p><p><b>步骤：</b>准备目标状态 → 触发对应操作 → 读取结果与记录。</p><p><b>预期：</b>行为符合已确认需求，关联断言独立记录。</p><div class="evidence">执行映射：'+c[3]+'<br>当前状态：'+c[4]+'<br>此处为结构示意，尚未从真实需求生成完整用例。</div><div class="field"><label>评审意见</label><textarea placeholder="这个用例缺了什么？哪些步骤可以合并？"></textarea></div><button class="primary" onclick="closeModal();toast(\'已记录当前原型的评审动作，未保存到后台\')">确认用例（模拟）</button>')}
function evidence(){return '<div class="panel"><div class="panelhead"><h2>证据与决策</h2><span class="pill warn">需要你确认</span></div><div class="panelbody"><div class="small muted">当前节点</div><h3 style="margin-top:10px">'+names[stage]+' · '+statuses[stage]+'</h3><div class="decision"><b>'+['确认测试点是否完整','确认执行范围与账号条件','确认共同根因是否成立','确认哪些问题进入提单','审阅复现步骤与字段','决定是否验证通过'][stage]+'</b><p class="small muted">系统提供建议，你保留最终决定。</p></div><div class="evidence">代码：本地已有分支<br>项目：'+escapeHtml(projects.get(currentProject).name)+'<br>构建 / SHA：未锁定<br>运行证据：未采集<br>飞书 / GM：未连接</div><h3>决策记录</h3>'+(decisions.length?decisions.slice(-4).map(x=>'<div class="log">'+x+'</div>').join(''):'<p class="small muted">尚无决策。点击节点按钮体验流程。</p>')+'</div></div>'}
function content(){if(currentProject!=='gagasort'&&stage>0)return '<div class="evidence">该项目还没有测试任务产物。请先导入需求、生成用例并配置执行环境。</div>';if(stage===0)return '<div class="field"><label>需求来源</label><textarea placeholder="粘贴一个或多个飞书需求链接，每行一个"></textarea></div><div class="toolbar"><label><button onclick="document.getElementById(\'files\').click()">↑ 导入需求文件</button><input id="files" type="file" multiple style="display:none" onchange="toast(\'已选择 \'+this.files.length+\' 个文件；原型未解析或上传\')"></label><button class="soft" onclick="toast(\'展示预置示例用例，未调用模型生成\')">生成用例（示例）</button></div><div class="toolbar"><h3>用例预览</h3><span class="muted small">'+cases.length+' 条用例 · 原型数据，来源未绑定</span></div>'+caseTable();if(stage===1)return '<div class="toolbar"><div><span class="pill">master · 本地已有代码</span> <span class="pill warn">构建未锁定</span></div><button onclick="showSettings()">配置执行环境</button></div><div class="evidence">执行范围：逻辑测试 / PlayMode / 真实 UI<br>GM 前置：需要时配置专用测试账号<br>未接入用例会保留为缺口，不计作通过。</div>'+caseTable()+'<div style="margin-top:18px"><button class="primary" onclick="simulateRun()">▶ 模拟执行</button> <button onclick="run=false;toast(\'模拟任务已停止\')">停止</button></div>';if(stage===2)return '<p class="muted small">以下分组仅为演示归因工作台，未确认真实代码缺陷。</p><div class="cards">'+[['RC-01','设置值缓存与存档读取顺序','关联 TC-001 · 根因待确认'],['RC-02','跨日领取计数口径','关联 TC-002 · 需求歧义'],['RC-03','空奖励配置处理','关联 TC-003 · 需要补充运行证据']].map(x=>'<div class="bug"><span class="code">'+x[0]+'</span><h3 style="margin-top:8px">'+x[1]+'</h3><p>'+x[2]+'</p><button onclick="toast(\'模拟确认该根因组\')">确认归因</button> <button onclick="toast(\'模拟拆分；正式版本将重新关联证据\')">拆分分组</button> <button onclick="toast(\'已标记为待补证据（模拟）\')">待补证据</button></div>').join('')+'</div>';if(stage===3)return '<div class="toolbar"><h3>选择进入提单的问题</h3><select style="width:170px" onchange="toast(\'筛选条件：\'+this.value+\'（示意）\')"><option>全部候选问题</option><option>确认缺陷</option><option>需求歧义</option><option>证据不足</option></select></div>'+caseTable()+'<div class="evidence">按确认根因合并，不按报错文案直接合并。未选问题留在任务内，不丢弃证据。</div>';if(stage===4)return '<div class="field"><label>飞书 Bug 单 / 表格链接</label><input placeholder="粘贴目标链接，读取真实字段后映射"></div><div class="bug"><span class="pill warn">内部草稿 · 未发布</span><h3 style="margin-top:14px">[示例] 设置开关首次操作未按存档状态切换</h3><p>关联根因 RC-01　·　关联用例 TC-001<br>环境、复现结果与证据尚未采集。</p><button onclick="bugDraft()">审阅 Bug 草稿</button> <button onclick="toast(\'飞书未连接，无法发布；未创建 Bug 单\')">确认发布到飞书</button></div>';return '<div class="toolbar"><h3>待验证 Bug</h3><label class="small muted"><input type="checkbox" style="width:auto" onchange="toast(\'原型不会启动自动监控或拉取代码\')"> 自动触发回归</label></div><div class="bug"><span class="pill warn">待验证 · 示例状态</span><h3 style="margin-top:14px">BUG-DEMO-01 · 设置开关首次切换</h3><p>原失败用例 TC-001 + 关联状态回归<br>修复版本：未提供　/　执行证据：未采集</p><button class="primary" onclick="regress()">↻ 模拟回归</button> <button onclick="toast(\'缺少真实验证证据；未修改飞书状态\')">确认验证通过</button></div><div class="evidence" id="regression">修复判断：证据不足<br>修复概率：不提供未经校准的数字<br>最终状态变更由你确认。</div>'}
function simulateRun(){const runProject=currentProject;run=true;cases.forEach(c=>{if(c[4]!=='未接入')c[4]='运行中（模拟）'});render();setTimeout(()=>{if(!run||currentProject!==runProject)return;cases.forEach((c,i)=>{if(c[4]!=='未接入')c[4]=['示例失败','待确认','证据不足'][i%3]});run=false;render();toast('模拟执行结束；没有运行 Unity 或 GM')},1200)}function regress(){document.getElementById('regression').innerHTML='模拟回归结果：原失败场景通过，关联场景 2 / 3 通过<br>仍有 1 个场景未验证，应继续补证据。<br>以上全部为预置示例，不能据此确认真实 Bug 已修复。';toast('仅展示回归结果布局，未执行测试')}
function bugDraft(){modal('审阅 Bug 草稿','<span class="pill warn">示例草稿 · 未运行复现</span><div class="field" style="margin-top:18px"><label>标题</label><input value="[示例] 设置开关首次操作未按存档状态切换"></div><div class="field"><label>复现步骤 / 预期 / 实际</label><textarea style="height:210px">前置：专用账号已有关闭状态存档。\n1. 启动目标版本。\n2. 打开设置页面。\n3. 首次点击对应开关。\n预期：按已保存状态切换。\n实际：待真实运行采集，不填写推测结果。\n证据：尚未采集。\n根因：候选 RC-01，待确认。</textarea></div><button class="primary" onclick="closeModal();toast(\'示例草稿已确认，未写入飞书\')">确认草稿（模拟）</button>')}
function render(){syncProject();['A','B','C'].forEach(v=>document.getElementById('v'+v.toLowerCase()).className=v===layout?'on':'');let metrics='<div class="metrics">'+[['需求测试点','8','示例 · 需确认来源'],['演示用例','470','重复示例 · 用于分页评审'],['根因候选','3','示例 · 尚未确认'],['待验证 Bug','1','示例 · 未同步飞书']].map(x=>'<div class="metric"><span>'+x[0]+'</span><strong>'+x[1]+'</strong><span>'+x[2]+'</span></div>').join('')+'</div>';let steps='<div class="flow-sticky"><div class="steps">'+names.map((n,i)=>'<div class="step '+(i===stage?'selected':'')+'" onclick="stage='+i+';render()"><span class="stepnum">'+(i+1)+'</span><b>'+n+'</b><div class="small">'+statuses[i]+'</div></div>').join('')+'</div></div>';let panel='<section class="panel"><div class="panelhead"><h2>'+names[stage]+'工作区</h2><span class="pill">'+statuses[stage]+'</span></div><div class="panelbody">'+content()+'</div><div class="footeraction"><span class="small muted">所有操作仅用于流程演示</span><div><button onclick="toast(\'当前节点已退回修改（模拟）\')">退回修改</button> <button class="primary" onclick="advance()">'+(stage===5?'保留验证决策':'确认并进入'+names[stage+1])+'</button></div></div></section>';let body;if(layout==='B')body='<div class="toolbar"><h2>闭环看板</h2><span class="muted small">点击任意卡片进入节点详情</span></div><div class="board">'+names.map((n,i)=>'<div class="lane"><h3>'+n+' <span class="pill">'+(i<2?'470':'1')+'</span></h3><div class="laneitem" onclick="stage='+i+';render()"><span class="pill '+(i===stage?'':'warn')+'">'+statuses[i]+'</span><p><b>'+['需求导入与用例评审','指定代码与账号条件','共同根因确认','保留可提单问题','复现步骤与字段映射','修复证据与人工决策'][i]+'</b></p><span class="small muted">'+escapeHtml(projects.get(currentProject).name)+' · 示例任务</span></div><button style="width:100%" onclick="stage='+i+';render()">查看节点 →</button></div>').join('')+'</div><div style="margin-top:22px" class="columns">'+panel+evidence()+'</div>';else if(layout==='C')body='<div class="decisionlayout"><div class="queue"><h3>需要我的决策</h3><p class="small muted">按决策推进，而非自动跳过</p>'+names.map((n,i)=>'<div class="queueitem '+(i===stage?'active':'')+'" onclick="stage='+i+';render()"><b>'+n+'确认</b><p class="small muted">'+statuses[i]+'</p></div>').join('')+'</div><div>'+panel+'<div style="margin-top:20px">'+evidence()+'</div></div></div>';else body=steps+'<div class="columns">'+panel+evidence()+'</div>';document.getElementById('app').innerHTML=body}render();
</script></body></html>
