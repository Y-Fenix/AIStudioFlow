interface:
  display_name: "TEST_Codetest"
  short_description: "一键检查代码初步质量，自行代入条件，分列自动化和真实环境残留并校验报告"
  default_prompt: "请使用 $test-codetest 逐条检查用例，默认输出代码初步质量结论，自行代入时间、配置、存档和回调，默认做静态审查与测试可执行性核对；明确要求执行/自动验证时再运行范围内本地测试，分列真实环境残留，运行报告校验并交付单页签 Excel 和 HTML；新运行的第一条交互先询问是否授权本次外部 Bug 提单，同次联用和恢复不重复询问，未授权时保持只读。"
